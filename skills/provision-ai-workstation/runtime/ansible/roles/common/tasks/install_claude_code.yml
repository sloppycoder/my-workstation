- name: Install Claude Code CLI for {{ new_user_name }}
  become: yes
  become_user: "{{ new_user_name }}"
  shell:
    cmd: |
      set -e
      curl -fsSL https://claude.ai/install.sh | bash
    creates: "/home/{{ new_user_name }}/.local/bin/claude"
  environment:
    HOME: "/home/{{ new_user_name }}"
