# AWS Mountpoint for S3 -- FUSE-mounts an S3 bucket as a local filesystem,
# e.g. `mount-s3 <bucket> <mountpoint>`. Uses the instance's IAM role
# credentials automatically (no separate config step, unlike rclone).
# GPG signature verified against AWS's published key before install, per
# AWS's own instructions.
- name: Create temp dir for the Mountpoint for S3 installer
  become: yes
  file:
    path: /tmp/mount-s3-src
    state: directory
    mode: "0755"

- name: Download Mountpoint for S3 public key
  become: yes
  get_url:
    url: https://s3.amazonaws.com/mountpoint-s3-release/public_keys/KEYS
    dest: /tmp/mount-s3-src/KEYS
    mode: "0644"

- name: Import Mountpoint for S3 public key
  become: yes
  shell: gpg --import /tmp/mount-s3-src/KEYS
  changed_when: true

- name: Download Mountpoint for S3 package
  become: yes
  get_url:
    url: https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.deb
    dest: /tmp/mount-s3-src/mount-s3.deb
    mode: "0644"
    force: yes

- name: Download Mountpoint for S3 package signature
  become: yes
  get_url:
    url: https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.deb.asc
    dest: /tmp/mount-s3-src/mount-s3.deb.asc
    mode: "0644"
    force: yes

- name: Verify Mountpoint for S3 package signature
  become: yes
  shell: gpg --verify /tmp/mount-s3-src/mount-s3.deb.asc /tmp/mount-s3-src/mount-s3.deb
  changed_when: false

- name: Install Mountpoint for S3
  become: yes
  apt:
    deb: /tmp/mount-s3-src/mount-s3.deb

# Leave a ready-to-edit (commented out) fstab entry so adding a mount later is just:
# uncomment, set bucket + mount point, `sudo mkdir -p <mnt>`, `sudo mount <mnt>`.
# Mountpoint's fstab support needs v1.18+; _netdev,nosuid,nodev are mandatory.
- name: Look up uid/gid of {{ new_user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ new_user_name }}"

- name: Add a commented example Mountpoint for S3 mount to /etc/fstab
  become: yes
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} ANSIBLE MANAGED: mount-s3 example"
    block: |
      # Mount an S3 bucket as {{ new_user_name }}: uncomment, set the bucket and mount point, then:
      #   sudo mkdir -p /mnt/my-bucket && sudo systemctl daemon-reload && sudo mount /mnt/my-bucket
      # Add allow-delete / allow-overwrite for rm / overwrites, region=<r> for a bucket in another region.
      # Auth is the instance role (IMDS); mount-s3 runs as root under fstab, so allow-other is needed.
      #s3://my-bucket /mnt/my-bucket mount-s3 _netdev,nosuid,nodev,nofail,rw,allow-other,uid={{ getent_passwd[new_user_name][1] }},gid={{ getent_passwd[new_user_name][2] }} 0 0
