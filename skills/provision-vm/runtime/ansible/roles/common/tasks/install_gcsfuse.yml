# Cloud Storage FUSE (gcsfuse) -- GCP counterpart of Mountpoint for S3.
# e.g. `gcsfuse <bucket> <mountpoint>`. Uses the VM service account's
# credentials automatically via the metadata server.
- name: Add Google Cloud apt signing key
  become: yes
  get_url:
    url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
    dest: /usr/share/keyrings/cloud.google.asc
    mode: "0644"

- name: Add gcsfuse apt repo
  become: yes
  copy:
    dest: /etc/apt/sources.list.d/gcsfuse.list
    content: "deb [signed-by=/usr/share/keyrings/cloud.google.asc] https://packages.cloud.google.com/apt gcsfuse-{{ ansible_facts['distribution_release'] }} main\n"
    mode: "0644"

- name: Install gcsfuse
  become: yes
  apt:
    update_cache: yes
    name: gcsfuse
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

# Leave a ready-to-edit (commented out) fstab entry so adding a mount later is just:
# uncomment, set bucket + mount point, `sudo mkdir -p <mnt>`, `sudo mount <mnt>`.
- name: Look up uid/gid of {{ new_user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ new_user_name }}"

- name: Add a commented example gcsfuse mount to /etc/fstab
  become: yes
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} ANSIBLE MANAGED: gcsfuse example"
    block: |
      # Mount a Cloud Storage bucket as {{ new_user_name }}: uncomment, set the bucket and
      # mount point, then: sudo mkdir -p /mnt/my-bucket && sudo systemctl daemon-reload && sudo mount /mnt/my-bucket
      # Copied from a working mount (tracker VM, gcsfuse 3.13.0). fstab flags use underscores
      # (implicit_dirs, not implicit-dirs). Auth is the VM's service account. Do NOT add nofail:
      # gcsfuse forwards it to FUSE and the mount fails with "invalid argument". x-systemd.* options
      # are consumed by systemd/mount. implicit_dirs lists folders that have no placeholder object.
      #my-bucket /mnt/my-bucket gcsfuse rw,_netdev,implicit_dirs,allow_other,uid={{ getent_passwd[new_user_name][1] }},gid={{ getent_passwd[new_user_name][2] }},x-systemd.device-timeout=10 0 0
